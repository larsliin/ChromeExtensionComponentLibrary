name: Release package

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Determine release
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const { getReleasePlan } = require('./scripts/github-release.mjs');
            const { version } = require('./package.json');
            const sha = require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const plan = await getReleasePlan({
              github,
              context: { repo: context.repo, ref: context.ref, sha },
              version,
            });
            core.setOutput('tag', plan.tag);
            core.setOutput('sha', sha);
            core.setOutput('publish', plan.publish);
            core.info(plan.publish ? `Preparing ${plan.tag}` : `${plan.tag} is already published; skipping.`);
      - run: npm ci
        if: steps.release.outputs.publish == 'true'
      - run: npm test
        if: steps.release.outputs.publish == 'true'
      - name: Pack tested build
        if: steps.release.outputs.publish == 'true'
        run: npm pack --ignore-scripts
      - name: Publish release archive
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "$RELEASE_TAG" \
            "chrome-extension-component-library-${version}.tgz" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
