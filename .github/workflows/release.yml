name: Create package
run-name: Create package (${{ inputs.bump }}) by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (from the latest release)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Determine package version
        id: release
        uses: actions/github-script@v8
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        with:
          script: |
            const { getReleasePlan } = require('./scripts/github-release.mjs');
            const { version } = require('./package.json');
            const plan = await getReleasePlan({
              github,
              context: { repo: context.repo, ref: context.ref },
              version,
              bump: process.env.VERSION_BUMP,
            });
            core.setOutput('tag', plan.tag);
            core.setOutput('version', plan.version);
            core.info(`Package version: ${plan.version} (${process.env.VERSION_BUMP} from ${plan.baseVersion})`);
            await core.summary
              .addHeading(`Create package ${plan.tag}`)
              .addRaw(`Version: **${plan.version}** (${process.env.VERSION_BUMP} from ${plan.baseVersion}).\n\n`)
              .addRaw(`Source commit: \`${context.sha}\`. No source files will be committed.\n\n`)
              .write();
      - run: npm ci
      - name: Set generated package version (no commit or tag)
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: npm version "$PACKAGE_VERSION" --no-git-tag-version --ignore-scripts
      - run: npm test
      - name: Pack tested build
        run: npm pack --ignore-scripts
      - name: Publish package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Publishing package version: $PACKAGE_VERSION"
          gh release create "$RELEASE_TAG" \
            "chrome-extension-component-library-${PACKAGE_VERSION}.tgz" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/chrome-extension-component-library-${PACKAGE_VERSION}.tgz"
          echo "Install: npm install $url"
          {
            echo "## Published package $PACKAGE_VERSION"
            echo
            echo "[View release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})"
            echo
            echo '```bash'
            echo "npm install $url"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
