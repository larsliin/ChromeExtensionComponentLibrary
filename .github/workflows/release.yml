name: Release package

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        run: |
          node -e "const { version } = require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + version) throw new Error('Release tag must match package.json version')"
      - run: npm ci
      - run: npm test
      - name: Pack tested build
        run: npm pack --ignore-scripts
      - name: Publish release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "$GITHUB_REF_NAME" \
            "chrome-extension-component-library-${version}.tgz" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
